name: sams_app
description: Student Academic Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  webview_flutter: ^4.8.0
  share_plus: ^12.0.2
  path_provider: ^2.1.3
  pdf: ^3.10.8
  iconsax_flutter: ^1.0.0
  lottie: ^3.1.0
  figma_squircle: ^0.6.0
  confetti: ^0.7.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  moon_design: ^1.1.0
